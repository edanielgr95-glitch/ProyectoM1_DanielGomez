<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Colorfly Studio | Paleta de colores</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>Colorfly Studio</h1>
        <p>Paleta generadora de colores</p>
    </header>
    <main>
        <section class="controls">
            <h2>Options</h2>
            <div class="field">
                <label for="size">Tamaño de la paleta:</label>
                <select id="size">
                    <option value="6">6 colors</option>
                    <option value="8">8 colors</option>
                    <option value="9">9 colors</option>
                </select>
            </div>
        </section>  
        <section id="color-palette">
            <h2>Paleta de colores</h2>
            <div id="Paleta" class="color-cards">
                <!-- Color cards will be generated by JavaScript -->
            </div>
        </section>
    </main>
    <script src="script.js"></script>
</body>
</html>
